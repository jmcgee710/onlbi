<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo-light.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e7c86" />

    <!-- Invariant social tags. Per-page title, description, canonical, and
         OG/Twitter tags are injected at build time by prerender.mjs at the
         placeholder below (source: src/lib/seo.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="On LBI" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Site-wide structured data (town pages add their own TouristDestination) -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebSite","name":"On LBI","alternateName":"On Long Beach Island","url":"https://onlongbeachisland.com/","about":"Visitor guide to Long Beach Island, New Jersey — beaches, badges, dining, accessibility, and getting around."}
    </script>
    <!--app-head-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
